name: warp_vpn_app
description: اپلیکیشن وی‌پی‌ان وارپ با قابلیت تولید خودکار کانفیگ
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1
  http: ^1.1.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  flutter_native_wireguard: ^0.1.0
  provider: ^6.0.5
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
