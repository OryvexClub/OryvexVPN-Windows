name: Build Windows VPN App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v

    - name: Create data directory
      run: |
        New-Item -ItemType Directory -Force -Path "data"
        echo "Data directory created"
      shell: powershell

    - name: Download WireGuard
      run: |
        $wgUrl = "https://download.wireguard.com/windows-client/wireguard-installer.exe"
        $installerPath = "$env:TEMP\wireguard-installer.exe"

        Write-Host "Downloading WireGuard from official source..."
        Invoke-WebRequest -Uri $wgUrl -OutFile $installerPath -UseBasicParsing

        Write-Host "Installing WireGuard silently..."
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow

        Start-Sleep -Seconds 3

        $wgPath = "C:\Program Files\WireGuard\wireguard.exe"
        if (Test-Path $wgPath) {
          Copy-Item $wgPath -Destination "data\wireguard.exe" -Force
          Write-Host "SUCCESS: wireguard.exe copied"
          $size = (Get-Item 'data\wireguard.exe').Length / 1MB
          Write-Host "  Size: $size MB"
        } else {
          Write-Host "ERROR: WireGuard not found at expected location"
          Write-Host "Checking alternative locations..."

          $altPaths = @(
            "C:\Program Files (x86)\WireGuard\wireguard.exe",
            "$env:ProgramFiles\WireGuard\wireguard.exe"
          )

          $found = $false
          foreach ($altPath in $altPaths) {
            if (Test-Path $altPath) {
              Copy-Item $altPath -Destination "data\wireguard.exe" -Force
              Write-Host "SUCCESS: Found and copied from: $altPath"
              $found = $true
              break
            }
          }

          if (-not $found) {
            Write-Host "ERROR: Could not find WireGuard executable"
            exit 1
          }
        }

        $wgExe = "C:\Program Files\WireGuard\wg.exe"
        if (Test-Path $wgExe) {
          Copy-Item $wgExe -Destination "data\wg.exe" -Force
          Write-Host "SUCCESS: wg.exe copied"
        }

        if (Test-Path "data\wireguard.exe") {
          Write-Host ""
          Write-Host "=== WireGuard Setup Complete ==="
          $wgSize = (Get-Item 'data\wireguard.exe').Length
          Write-Host "wireguard.exe: $wgSize bytes"
          if (Test-Path "data\wg.exe") {
            $wgExeSize = (Get-Item 'data\wg.exe').Length
            Write-Host "wg.exe: $wgExeSize bytes"
          }
        } else {
          Write-Host "ERROR: Failed to copy WireGuard executables"
          exit 1
        }
      shell: powershell
      continue-on-error: false

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyzer
      run: flutter analyze
      continue-on-error: true

    - name: Build Windows application
      run: flutter build windows --release

    - name: Copy data folder to build
      run: |
        if (Test-Path "data") {
          Copy-Item -Path "data" -Destination "build\windows\x64\runner\Release\data" -Recurse -Force
          Write-Host "Data folder copied to release build"
        }
      shell: powershell

    - name: Create build info
      run: |
        $buildInfo = @{
          "build_date" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "commit_sha" = "${{ github.sha }}"
          "branch" = "${{ github.ref_name }}"
          "flutter_version" = (flutter --version | Select-String -Pattern "Flutter (\d+\.\d+\.\d+)" | ForEach-Object { $_.Matches.Groups[1].Value })
        }
        $buildInfo | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\build_info.json"
      shell: powershell

    - name: Package application
      run: |
        $releaseDir = "build\windows\x64\runner\Release"
        $outputZip = "OryvexVPN-Windows-x64.zip"

        # Create zip package
        Compress-Archive -Path "$releaseDir\*" -DestinationPath $outputZip -Force

        Write-Host "Package created: $outputZip"
        Write-Host "Package size: $((Get-Item $outputZip).Length / 1MB) MB"
      shell: powershell

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-Windows-Build
        path: OryvexVPN-Windows-x64.zip
        retention-days: 30

    - name: Upload release directory
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-Windows-Release-Files
        path: build/windows/x64/runner/Release/
        retention-days: 7

    # Removed automatic release creation
    # To create a release manually:
    # 1. Go to GitHub Releases
    # 2. Create a new release
    # 3. Attach the OryvexVPN-Windows-x64.zip from artifacts
