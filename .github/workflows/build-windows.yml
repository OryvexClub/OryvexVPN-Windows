name: Build Windows VPN App with AmneziaWG

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v

    - name: Create data directory
      run: |
        New-Item -ItemType Directory -Force -Path "data"
        echo "Data directory created"
      shell: powershell

    - name: Download oryvex core binary
      uses: dawidd6/action-download-artifact@v6
      with:
        repo: OryvexClub/OryvexCore
        workflow: build.yml
        branch: main
        name: oryvex-windows-x64
        path: data
        search_artifacts: true
      continue-on-error: true

    - name: Verify oryvex binary
      run: |
        if (Test-Path "data\oryvex.exe") {
          $size = (Get-Item "data\oryvex.exe").Length
          Write-Host "oryvex.exe downloaded: $size bytes"
        } else {
          Write-Host "WARNING: oryvex.exe not found - app will use AmneziaWG fallback only"
        }
      shell: powershell

    - name: Download Xray core binary
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "Downloading Xray core from GitHub releases..."

        $xrayVersion = "1.8.24"
        $xrayUrl = "https://github.com/XTLS/Xray-core/releases/download/v$xrayVersion/Xray-windows-64.zip"
        $zip = "$env:TEMP\xray.zip"
        $out = "$env:TEMP\xray-extract"

        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $webClient = New-Object System.Net.WebClient
        $webClient.DownloadFile($xrayUrl, $zip)

        Expand-Archive -Path $zip -DestinationPath $out -Force
        $xrayExe = Get-ChildItem -Path $out -Recurse -Filter "xray.exe" | Select-Object -First 1

        if ($xrayExe) {
          Copy-Item $xrayExe.FullName -Destination "data\xray.exe" -Force
          Write-Host "xray.exe bundled: $((Get-Item 'data\xray.exe').Length) bytes"
        } else {
          Write-Host "ERROR: xray.exe not found in Xray release archive"
          exit 1
        }
      shell: powershell
      continue-on-error: false

    - name: Verify Xray binary
      run: |
        if (Test-Path "data\xray.exe") {
          $size = (Get-Item "data\xray.exe").Length
          Write-Host "xray.exe: $size bytes"
        } else {
          Write-Host "ERROR: xray.exe not found"
          exit 1
        }
      shell: powershell

    - name: Download AmneziaWG
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "Downloading AmneziaWG from GitHub releases..."

        # Try multiple release versions in order
        $versions = @("2.0.2", "2.0.1", "2.0.0", "1.0.2")
        $downloaded = $false
        $amneziaMsi = "$env:TEMP\amneziawg-amd64.msi"

        foreach ($version in $versions) {
          $amneziaUrl = "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/download/$version/amneziawg-amd64-$version.msi"
          Write-Host "Trying version $version..."

          try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $webClient = New-Object System.Net.WebClient
            $webClient.DownloadFile($amneziaUrl, $amneziaMsi)
            $downloaded = $true
            Write-Host "Successfully downloaded version $version"
            break
          } catch {
            Write-Host "Version $version not available, trying next..."
          }
        }

        if (-not $downloaded) {
          Write-Host "ERROR: Failed to download AmneziaWG from any release version"
          exit 1
        }

        Write-Host "Extracting AmneziaWG payload..."
        $extractDir = "$env:TEMP\amneziawg-payload"
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/a `"$amneziaMsi`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow

        # Find AmneziaWG directory and executables
        Write-Host "Searching for AmneziaWG executables..."
        $amneziaExe = Get-ChildItem -Path $extractDir -Recurse -Filter "amneziawg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        $awgExe = Get-ChildItem -Path $extractDir -Recurse -Filter "awg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($amneziaExe) {
          Copy-Item $amneziaExe.FullName -Destination "data\amneziawg.exe" -Force
          Write-Host "amneziawg.exe copied: $((Get-Item 'data\amneziawg.exe').Length) bytes"
        } else {
          Write-Host "ERROR: amneziawg.exe not found in MSI payload"
          exit 1
        }

        if ($awgExe) {
          Copy-Item $awgExe.FullName -Destination "data\awg.exe" -Force
          Write-Host "awg.exe copied: $((Get-Item 'data\awg.exe').Length) bytes"
        } else {
          Write-Host "WARNING: awg.exe not found, using amneziawg.exe for stats"
          Copy-Item "data\amneziawg.exe" -Destination "data\awg.exe" -Force
        }

        Write-Host ""
        Write-Host "=== AmneziaWG Setup Complete ==="
      shell: powershell
      continue-on-error: false

    - name: Bundle app resources (tray icon)
      run: |
        $ErrorActionPreference = "Continue"
        if (Test-Path "windows\runner\resources\app_icon.ico") {
          Copy-Item "windows\runner\resources\app_icon.ico" -Destination "data\app_icon.ico" -Force
          Write-Host "Tray icon bundled: $((Get-Item 'data\app_icon.ico').Length) bytes"
        } else {
          Write-Host "WARNING: app_icon.ico not found at windows\runner\resources"
        }
      shell: powershell

    - name: Download wintun driver
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "$env:TEMP\wintun.zip"
        $out = "$env:TEMP\wintun-extract"
        Write-Host "Downloading wintun virtual adapter driver..."

        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $webClient = New-Object System.Net.WebClient
        $webClient.DownloadFile("https://www.wintun.net/builds/wintun-0.14.1.zip", $zip)

        Expand-Archive -Path $zip -DestinationPath $out -Force
        $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
        if (-not $dll) { $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Select-Object -First 1 }
        if (-not $dll) {
          Write-Host "ERROR: wintun.dll not found in archive"
          exit 1
        }
        Copy-Item $dll.FullName -Destination "data\wintun.dll" -Force
        Write-Host "wintun.dll bundled: $((Get-Item 'data\wintun.dll').Length) bytes"
      shell: powershell
      continue-on-error: false

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyzer
      run: flutter analyze
      continue-on-error: true

    - name: Build Windows application
      run: flutter build windows --release

    - name: Copy data folder to build
      run: |
        $releaseData = "build\windows\x64\runner\Release\data"
        if (Test-Path "data") {
          if (-not (Test-Path $releaseData)) {
            New-Item -ItemType Directory -Force -Path $releaseData | Out-Null
          }
          Copy-Item -Path "data\*" -Destination $releaseData -Recurse -Force
          Write-Host "Data folder contents copied to release build:"
          Get-ChildItem $releaseData | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
      shell: powershell

    - name: Install Inno Setup
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "Installing Inno Setup..."

        # Prefer winget when available: it downloads, verifies, and installs
        # Inno Setup reliably from an official source.
        if (Get-Command winget -ErrorAction SilentlyContinue) {
          Write-Host "Using winget to install Inno Setup..."
          winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Inno Setup installed via winget"
            exit 0
          }
          Write-Host "winget install failed (exit $LASTEXITCODE), falling back to direct download"
        }

        # Fallback: jrsoftware.org/download.php serves an HTML redirect to a
        # mirror, unless a browser-like User-Agent is sent. The older
        # System.Net.WebClient downloads that HTML as the .exe, which is why the
        # installer was "corrupted and unreadable". Use Invoke-WebRequest with a
        # User-Agent and verify the result is a real PE file.
        Write-Host "Downloading Inno Setup from jrsoftware.org..."
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $innoInstaller = "$env:TEMP\innosetup.exe"
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" `
          -OutFile $innoInstaller `
          -Headers @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" } `
          -UseBasicParsing

        # Sanity check: a real Windows exe begins with "MZ" and is not a few KB
        # of HTML from a failed redirect.
        $bytes = [System.IO.File]::ReadAllBytes($innoInstaller)
        $isPe = $bytes.Length -ge 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A
        if (-not $isPe) {
          Write-Host "ERROR: downloaded Inno Setup installer is not a valid executable ($($bytes.Length) bytes)"
          exit 1
        }
        Write-Host "Downloaded valid installer ($([math]::Round($bytes.Length / 1MB, 2)) MB)"

        Start-Process -FilePath $innoInstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -NoNewWindow
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Inno Setup installer exited with code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "Inno Setup installed successfully"
      shell: powershell

    - name: Build installer with Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          Write-Host "ERROR: Inno Setup compiler not found at $iscc"
          exit 1
        }

        Write-Host "Compiling installer with Inno Setup..."
        & $iscc "installer\installer.iss"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Inno Setup compilation failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        Write-Host "Installer created successfully"
        if (Test-Path "installer\Output") {
          Get-ChildItem "installer\Output" | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        }
      shell: powershell

    - name: Create build info
      run: |
        $buildInfo = @{
          "build_date" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "commit_sha" = "${{ github.sha }}"
          "branch" = "${{ github.ref_name }}"
          "flutter_version" = (flutter --version | Select-String -Pattern "Flutter (\d+\.\d+\.\d+)" | ForEach-Object { $_.Matches.Groups[1].Value })
          "vpn_core" = "AmneziaWG"
        }
        $buildInfo | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\build_info.json"
      shell: powershell

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-Windows-Installer
        path: installer/Output/*.exe
        retention-days: 30
