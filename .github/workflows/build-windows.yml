name: Build Windows VPN App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v

    - name: Create data directory
      run: |
        New-Item -ItemType Directory -Force -Path "data"
        echo "Data directory created"
      shell: powershell

    - name: Download WireGuard
      run: |
        $ErrorActionPreference = "Stop"

        $wgMsi = "$env:TEMP\wireguard-amd64.msi"
        $extractDir = "$env:TEMP\wireguard-payload"

        Write-Host "Downloading WireGuard MSI from official source..."
        Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi" -OutFile $wgMsi -UseBasicParsing

        Write-Host "Extracting WireGuard payload (msiexec administrative install)..."
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/a `"$wgMsi`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow

        # Administrative install extracts wg.exe and wireguard.exe under <TARGETDIR>\WireGuard\
        $srcDir = "$extractDir\WireGuard"

        if (-not (Test-Path "$srcDir\wireguard.exe")) {
          Write-Host "ERROR: wireguard.exe not found in extracted payload at: $srcDir"
          exit 1
        }

        Copy-Item "$srcDir\wg.exe"        -Destination "data\wg.exe"        -Force
        Copy-Item "$srcDir\wireguard.exe" -Destination "data\wireguard.exe" -Force

        if (Test-Path "data\wireguard.exe") {
          Write-Host ""
          Write-Host "=== WireGuard Setup Complete ==="
          Write-Host "wireguard.exe: $((Get-Item 'data\wireguard.exe').Length) bytes"
          Write-Host "wg.exe:        $((Get-Item 'data\wg.exe').Length) bytes"
        } else {
          Write-Host "ERROR: Failed to copy WireGuard executables into data\"
          exit 1
        }
      shell: powershell
      continue-on-error: false

    - name: Bundle app resources (tray icon)
      run: |
        $ErrorActionPreference = "Continue"
        if (Test-Path "windows\runner\resources\app_icon.ico") {
          Copy-Item "windows\runner\resources\app_icon.ico" -Destination "data\app_icon.ico" -Force
          Write-Host "Tray icon bundled: $((Get-Item 'data\app_icon.ico').Length) bytes"
        } else {
          Write-Host "WARNING: app_icon.ico not found at windows\runner\resources"
        }
      shell: powershell

    - name: Download wintun driver
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "$env:TEMP\wintun.zip"
        $out = "$env:TEMP\wintun-extract"
        Write-Host "Downloading wintun virtual adapter driver..."
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip -UseBasicParsing
        Expand-Archive -Path $zip -DestinationPath $out -Force
        $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
        if (-not $dll) { $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Select-Object -First 1 }
        if (-not $dll) {
          Write-Host "ERROR: wintun.dll not found in archive"
          exit 1
        }
        Copy-Item $dll.FullName -Destination "data\wintun.dll" -Force
        Write-Host "wintun.dll bundled: $((Get-Item 'data\wintun.dll').Length) bytes"
      shell: powershell
      continue-on-error: false

    - name: Install WireSock (best effort)
      run: |
        $ErrorActionPreference = "Continue"
        Write-Host "Attempting WireSock via winget (non-fatal)..."
        winget install --id NTKERNEL.WireSockVPNClient --silent --accept-package-agreements --accept-source-agreements 2>&1 | Out-Host
        Start-Sleep -Seconds 3
        $candidates = @(
          "C:\Program Files\WireSock\WireSock\wiresock.exe",
          "C:\Program Files\WireSock Secure Connect\wiresock.exe",
          "$env:LOCALAPPDATA\Programs\WireSock\wiresock.exe"
        )
        $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if ($found) {
          Copy-Item $found -Destination "data\wiresock.exe" -Force
          Write-Host "WireSock bundled from: $found"
        } else {
          Write-Host "WARNING: WireSock not found after install - official WireGuard fallback will be used."
        }
      shell: powershell
      continue-on-error: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyzer
      run: flutter analyze
      continue-on-error: true

    - name: Build Windows application
      run: flutter build windows --release

    - name: Copy data folder to build
      run: |
        $releaseData = "build\windows\x64\runner\Release\data"
        if (Test-Path "data") {
          # Flutter already creates Release\data (app.so, flutter_assets...).
          # Copy the *contents* (data\*) so our files land directly inside it;
          # copying the folder itself would nest it as data\data\.
          if (-not (Test-Path $releaseData)) {
            New-Item -ItemType Directory -Force -Path $releaseData | Out-Null
          }
          Copy-Item -Path "data\*" -Destination $releaseData -Recurse -Force
          Write-Host "Data folder contents copied to release build:"
          Get-ChildItem $releaseData | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
      shell: powershell

    - name: Create build info
      run: |
        $buildInfo = @{
          "build_date" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "commit_sha" = "${{ github.sha }}"
          "branch" = "${{ github.ref_name }}"
          "flutter_version" = (flutter --version | Select-String -Pattern "Flutter (\d+\.\d+\.\d+)" | ForEach-Object { $_.Matches.Groups[1].Value })
        }
        $buildInfo | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\build_info.json"
      shell: powershell

    - name: Package application
      run: |
        $releaseDir = "build\windows\x64\runner\Release"
        $outputZip = "OryvexVPN-Windows-x64.zip"

        # Create zip package
        Compress-Archive -Path "$releaseDir\*" -DestinationPath $outputZip -Force

        Write-Host "Package created: $outputZip"
        Write-Host "Package size: $((Get-Item $outputZip).Length / 1MB) MB"
      shell: powershell

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-Windows-Build
        path: OryvexVPN-Windows-x64.zip
        retention-days: 30

    - name: Upload release directory
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-Windows-Release-Files
        path: build/windows/x64/runner/Release/
        retention-days: 7

    # Removed automatic release creation
    # To create a release manually:
    # 1. Go to GitHub Releases
    # 2. Create a new release
    # 3. Attach the OryvexVPN-Windows-x64.zip from artifacts
