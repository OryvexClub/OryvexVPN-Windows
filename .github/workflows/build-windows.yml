name: Build Windows VPN App with AmneziaWG

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v

    - name: Create data directory
      run: |
        New-Item -ItemType Directory -Force -Path "data"
        echo "Data directory created"
      shell: powershell

    - name: Download AmneziaWG
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "Downloading AmneziaWG from GitHub releases..."

        # Try latest release first
        $amneziaUrl = "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/latest/download/amneziawg-amd64.msi"
        $amneziaMsi = "$env:TEMP\amneziawg-amd64.msi"

        try {
          Invoke-WebRequest -Uri $amneziaUrl -OutFile $amneziaMsi -UseBasicParsing -ErrorAction Stop
          Write-Host "Downloaded from latest release"
        } catch {
          Write-Host "Latest release not available, trying specific version..."
          $amneziaUrl = "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/download/v1.0.20230424/amneziawg-amd64.msi"
          Invoke-WebRequest -Uri $amneziaUrl -OutFile $amneziaMsi -UseBasicParsing
        }

        Write-Host "Extracting AmneziaWG payload..."
        $extractDir = "$env:TEMP\amneziawg-payload"
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/a `"$amneziaMsi`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow

        # Find AmneziaWG directory and executables
        Write-Host "Searching for AmneziaWG executables..."
        $amneziaExe = Get-ChildItem -Path $extractDir -Recurse -Filter "amneziawg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        $awgExe = Get-ChildItem -Path $extractDir -Recurse -Filter "awg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($amneziaExe) {
          Copy-Item $amneziaExe.FullName -Destination "data\amneziawg.exe" -Force
          Write-Host "amneziawg.exe copied: $((Get-Item 'data\amneziawg.exe').Length) bytes"
        } else {
          Write-Host "ERROR: amneziawg.exe not found in MSI payload"
          exit 1
        }

        if ($awgExe) {
          Copy-Item $awgExe.FullName -Destination "data\awg.exe" -Force
          Write-Host "awg.exe copied: $((Get-Item 'data\awg.exe').Length) bytes"
        } else {
          Write-Host "WARNING: awg.exe not found, using amneziawg.exe for stats"
          Copy-Item "data\amneziawg.exe" -Destination "data\awg.exe" -Force
        }

        Write-Host ""
        Write-Host "=== AmneziaWG Setup Complete ==="
      shell: powershell
      continue-on-error: false

    - name: Bundle app resources (tray icon)
      run: |
        $ErrorActionPreference = "Continue"
        if (Test-Path "windows\runner\resources\app_icon.ico") {
          Copy-Item "windows\runner\resources\app_icon.ico" -Destination "data\app_icon.ico" -Force
          Write-Host "Tray icon bundled: $((Get-Item 'data\app_icon.ico').Length) bytes"
        } else {
          Write-Host "WARNING: app_icon.ico not found at windows\runner\resources"
        }
      shell: powershell

    - name: Download wintun driver
      run: |
        $ErrorActionPreference = "Stop"
        $zip = "$env:TEMP\wintun.zip"
        $out = "$env:TEMP\wintun-extract"
        Write-Host "Downloading wintun virtual adapter driver..."
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip -UseBasicParsing
        Expand-Archive -Path $zip -DestinationPath $out -Force
        $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
        if (-not $dll) { $dll = Get-ChildItem -Path $out -Recurse -Filter "wintun.dll" | Select-Object -First 1 }
        if (-not $dll) {
          Write-Host "ERROR: wintun.dll not found in archive"
          exit 1
        }
        Copy-Item $dll.FullName -Destination "data\wintun.dll" -Force
        Write-Host "wintun.dll bundled: $((Get-Item 'data\wintun.dll').Length) bytes"
      shell: powershell
      continue-on-error: false

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyzer
      run: flutter analyze
      continue-on-error: true

    - name: Build Windows application
      run: flutter build windows --release

    - name: Copy data folder to build
      run: |
        $releaseData = "build\windows\x64\runner\Release\data"
        if (Test-Path "data") {
          if (-not (Test-Path $releaseData)) {
            New-Item -ItemType Directory -Force -Path $releaseData | Out-Null
          }
          Copy-Item -Path "data\*" -Destination $releaseData -Recurse -Force
          Write-Host "Data folder contents copied to release build:"
          Get-ChildItem $releaseData | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
      shell: powershell

    - name: Create build info
      run: |
        $buildInfo = @{
          "build_date" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "commit_sha" = "${{ github.sha }}"
          "branch" = "${{ github.ref_name }}"
          "flutter_version" = (flutter --version | Select-String -Pattern "Flutter (\d+\.\d+\.\d+)" | ForEach-Object { $_.Matches.Groups[1].Value })
          "vpn_core" = "AmneziaWG"
        }
        $buildInfo | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\build_info.json"
      shell: powershell

    - name: Package application
      run: |
        $releaseDir = "build\windows\x64\runner\Release"
        $outputZip = "OryvexVPN-AmneziaWG-Windows-x64.zip"

        # Create zip package
        Compress-Archive -Path "$releaseDir\*" -DestinationPath $outputZip -Force

        Write-Host "Package created: $outputZip"
        Write-Host "Package size: $((Get-Item $outputZip).Length / 1MB) MB"
      shell: powershell

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-AmneziaWG-Windows-Build
        path: OryvexVPN-AmneziaWG-Windows-x64.zip
        retention-days: 30

    - name: Upload release directory
      uses: actions/upload-artifact@v4
      with:
        name: OryvexVPN-AmneziaWG-Release-Files
        path: build/windows/x64/runner/Release/
        retention-days: 7
