name: Build Windows App (WireGuard + Real-time Stats)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Verify UAC manifest is correct
        run: |
          $manifest = "windows\runner\runner.exe.manifest"
          if (-not (Test-Path $manifest)) {
            Write-Error "runner.exe.manifest not found at $manifest"
            exit 1
          }
          $content = Get-Content $manifest -Raw
          if ($content -notmatch 'level="requireAdministrator"') {
            Write-Error "runner.exe.manifest is missing requireAdministrator - run fixer.py before committing."
            exit 1
          }
          Write-Host "Manifest OK: requireAdministrator present."

      - name: Clean previous build output
        run: flutter clean

      - name: Get dependencies (post-clean)
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Download WireGuard
        run: |
          $wgVersion = "0.5.3"
          $msiUrl = "https://download.wireguard.com/windows-client/wireguard-amd64-$wgVersion.msi"

          Write-Host "Downloading WireGuard v$wgVersion..."
          Invoke-WebRequest -Uri $msiUrl -OutFile "wireguard.msi"

          $extractDir = "$PWD\wireguard_extracted"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Write-Host "Extracting WireGuard MSI..."
          $msiExecArgs = @("/a", "`"$PWD\wireguard.msi`"", "/qn", "TARGETDIR=`"$extractDir`"")
          Start-Process msiexec.exe -ArgumentList $msiExecArgs -Wait -NoNewWindow

          $wgExe = Get-ChildItem -Path $extractDir -Filter "wireguard.exe" -Recurse | Select-Object -First 1
          if (-not $wgExe) {
            Write-Host "Failed to extract wireguard.exe from MSI."
            exit 1
          }

          Copy-Item $wgExe.FullName "$PWD\wireguard.exe"
          Write-Host "WireGuard extracted successfully: $($wgExe.FullName)"

      - name: Bundle WireGuard binary inside data/
        run: |
          $ReleaseDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$ReleaseDir\data" | Out-Null
          Copy-Item "$PWD\wireguard.exe" "$ReleaseDir\data\wireguard.exe"

          Write-Host "WireGuard bundled successfully in $ReleaseDir\data\"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer\installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oryvexvpn-windows-portable
          path: build/windows/x64/runner/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: oryvexvpn-windows-installer
          path: installer/Output/*.exe
